# The zero-cost local stack the e2e suite runs against (apps/api/e2e,
# `make e2e`). Nothing here talks to a real cloud account or a real git host.
# See README, "Testing without cloud accounts".
#
#   postgres    the API's database, thrown away on `down -v`
#   moto        AWS (STS, IAM, S3, DynamoDB, SNS, SQS, EC2, Lambda, Tagging API).
#               LocalStack's current images need an account and auth token;
#               moto is Apache-2.0 and needs neither.
#   cloudflare  Prism serving Cloudflare's own OpenAPI description (the subset
#               infralift calls, at a pinned commit) with a seeded account
#   mock-*      Prism serving the other providers' descriptions the same way
#               (profile "mocks"): DigitalOcean, Render, Vercel, Heroku,
#               Netlify, the Fly.io Machines API, Azure Resource Manager, and
#               Google Cloud and Firebase. Pins and seeds: apps/api/e2e/specs
#               (sources.ts, seeds/). GraphQL (Railway, Fly.io's platform API)
#               and the OAuth token endpoints are served by the provider fake
#               the suite starts on the host (apps/api/e2e/provider-fakes).
#   tofu        OpenTofu with bash and jq, run per step by the suite (profile
#               "tools", so `up` does not start it)
#
# The GitHub fake and the API run on the host from source, started by the
# suite, so tests can read their state directly.
#
# Ports bind to 127.0.0.1 only. scripts/e2e.sh sets the project name and the
# ports per checkout (COMPOSE_PROJECT_NAME, E2E_PORT_*, computed by
# apps/api/e2e/harness/ports.ts), so two worktrees can run the suite at once.
# The defaults below are for a bare `docker compose` with neither set, and
# harness/env.ts does not use them: run the stack through scripts/e2e.sh.

name: infralift-e2e

# One Prism per description: Prism serves a single document. --errors refuses
# a request the description would reject; single process, as for cloudflare.
x-prism: &prism
  image: stoplight/prism:5.15.10
  platform: linux/amd64
  profiles: ["mocks"]
  volumes: ["./apps/api/e2e/specs:/spec:ro"]

services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infralift_e2e
    ports: ["127.0.0.1:${E2E_PORT_POSTGRES:-55432}:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "infralift_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  moto:
    image: motoserver/moto:5.2.5
    ports: ["127.0.0.1:${E2E_PORT_MOTO:-55000}:5000"]
    networks:
      default:
        # hashicorp/aws 6.x reads S3 bucket tags through S3 Control, and the
        # SDK puts the account id in front of the endpoint's host
        # (123456789012.moto:5000). That is moto's default account, so this
        # name has to reach moto too, or generating a bucket's code fails.
        aliases: ["123456789012.moto"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/data.json')"]
      interval: 2s
      timeout: 3s
      retries: 30

  cloudflare:
    image: stoplight/prism:5.15.10
    # Prism publishes amd64 only; Docker on Apple silicon emulates it.
    platform: linux/amd64
    # --errors: a request the description would reject is answered with an
    # error, so the connector cannot pass by sending something Cloudflare
    # would refuse. Single process: the image's multiprocess mode crashes.
    command: ["mock", "/spec/cloudflare.openapi.json", "--host", "0.0.0.0", "--errors", "--multiprocess=false"]
    volumes: ["./apps/api/e2e/specs:/spec:ro"]
    ports: ["127.0.0.1:${E2E_PORT_CLOUDFLARE:-54010}:4010"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/user/tokens/verify',{headers:{authorization:'Bearer h'}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  mock-digitalocean:
    <<: *prism
    command: ["mock", "/spec/digitalocean.openapi.json", "--host", "0.0.0.0", "--errors", "--multiprocess=false"]
    ports: ["127.0.0.1:${E2E_PORT_DIGITALOCEAN:-54011}:4010"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/v2/account',{headers:{authorization:'Bearer h'}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
  mock-render:
    <<: *prism
    command: ["mock", "/spec/render.openapi.json", "--host", "0.0.0.0", "--errors", "--multiprocess=false"]
    ports: ["127.0.0.1:${E2E_PORT_RENDER:-54012}:4010"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/owners?limit=1',{headers:{authorization:'Bearer h'}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
  mock-vercel:
    <<: *prism
    command: ["mock", "/spec/vercel.openapi.json", "--host", "0.0.0.0", "--errors", "--multiprocess=false"]
    ports: ["127.0.0.1:${E2E_PORT_VERCEL:-54013}:4010"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/v2/user',{headers:{authorization:'Bearer h'}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
  mock-heroku:
    <<: *prism
    command: ["mock", "/spec/heroku.openapi.json", "--host", "0.0.0.0", "--errors", "--multiprocess=false"]
    ports: ["127.0.0.1:${E2E_PORT_HEROKU:-54014}:4010"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/account',{headers:{authorization:'Bearer h'}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
  mock-netlify:
    <<: *prism
    command: ["mock", "/spec/netlify.openapi.json", "--host", "0.0.0.0", "--errors", "--multiprocess=false"]
    ports: ["127.0.0.1:${E2E_PORT_NETLIFY:-54015}:4010"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/user',{headers:{authorization:'Bearer h'}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
  mock-flyio-machines:
    <<: *prism
    command: ["mock", "/spec/flyio-machines.openapi.json", "--host", "0.0.0.0", "--errors", "--multiprocess=false"]
    ports: ["127.0.0.1:${E2E_PORT_FLYIO_MACHINES:-54016}:4010"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/v1/apps/h/volumes',{headers:{authorization:'Bearer h'}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
  mock-azure:
    <<: *prism
    command: ["mock", "/spec/azure.openapi.json", "--host", "0.0.0.0", "--errors", "--multiprocess=false"]
    ports: ["127.0.0.1:${E2E_PORT_AZURE:-54017}:4010"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/subscriptions/h/providers/Microsoft.Storage/storageAccounts?api-version=2023-05-01',{headers:{authorization:'Bearer h'}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
  mock-google:
    <<: *prism
    command: ["mock", "/spec/google.openapi.json", "--host", "0.0.0.0", "--errors", "--multiprocess=false"]
    ports: ["127.0.0.1:${E2E_PORT_GOOGLE:-54018}:4010"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/storage/v1/b?project=h',{headers:{authorization:'Bearer h'}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  tofu:
    build: ./apps/api/e2e/tofu
    image: infralift-e2e-tofu:local
    profiles: ["tools"]
    environment:
      # moto's fixed test credentials; every AWS call goes to moto.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://moto:5000
      TF_PLUGIN_CACHE_DIR: /plugin-cache
    volumes: ["tofu-plugins:/plugin-cache"]
    depends_on:
      moto:
        condition: service_healthy

volumes:
  tofu-plugins:
