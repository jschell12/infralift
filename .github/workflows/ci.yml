name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The api's types come from the generated Prisma client, and three apps
      # import @infralift/shared — both have to exist before tsc runs.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared packages
        run: pnpm --filter './packages/*' build

      - name: Typecheck
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build apps
        run: pnpm --filter './apps/*' build

  stacks:
    name: Validate stacks
    # Every stack is rendered with its example inputs for each state backend
    # and the output run through tofu, terraform and shellcheck, because a
    # stack that renders but does not validate is broken customer output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared packages
        run: pnpm --filter './packages/*' build

      - run: pnpm --filter @infralift/api validate:stacks

  deploy-web:
    name: Deploy marketing site
    needs: [check, stacks]
    # Gated on its own variable so the job stays dormant until
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set. Without the
    # gate a missing secret turns main red on every merge.
    if: github.ref == 'refs/heads/main' && vars.WEB_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apps/web imports nothing from packages/shared and needs no Prisma
      # client, so it builds on its own. The docs pages are SSG from the
      # repo-root markdown, which is why this runs from a full checkout.
      - name: Build static export
        working-directory: apps/web
        env:
          NEXT_PUBLIC_DASHBOARD_URL: https://dashboard.infralift.dev
        run: pnpm build

      # Guard against the class of bug this job was added to stop shipping:
      # a localhost dashboard URL baked into the export.
      - name: Check the export for localhost links
        working-directory: apps/web
        run: |
          if grep -rl "localhost:" out/ >/dev/null 2>&1; then
            echo "::error::static export contains localhost links:"
            grep -rl "localhost:" out/ | head -20
            exit 1
          fi
          echo "no localhost links in export"

      # `pnpm deploy` is a pnpm builtin (deploy a workspace package to a
      # directory), so calling the package script by that name would silently
      # run the wrong thing. Invoke the pinned wrangler directly.
      - name: Deploy to Cloudflare
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

  deploy:
    name: Deploy to Framework
    needs: [check, stacks]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    # Runs on the Framework itself, on the runner schellout's github-runner
    # role registers for this repo (scripts/ci/ci-repos.yml: infralift). It
    # builds the :local images on the Framework's Docker daemon and restarts
    # the Nomad job that runs them, so no step crosses the LAN. The old
    # mac-mini runner only relayed these steps over ssh, and lost LAN access
    # to macOS Local Network Privacy after the mini rebooted on 2026-11-06.
    runs-on: [self-hosted, homelab-linux]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # NOMAD_ADDR comes from the runner's systemd unit and NOMAD_TOKEN from
      # the runner user's own ~/.agentsecrets, never from GitHub. Checked
      # before the build so a missing credential fails in seconds.
      - name: Check Nomad is reachable
        run: |
          if [ -f "$HOME/.agentsecrets" ]; then . "$HOME/.agentsecrets"; fi
          export NOMAD_ADDR="${NOMAD_ADDR:-http://127.0.0.1:4646}"
          if [ -z "${NOMAD_TOKEN:-}" ]; then
            echo "::error::NOMAD_TOKEN not found in ~/.agentsecrets on this runner"
            exit 1
          fi
          export NOMAD_TOKEN
          nomad job status -short infralift >/dev/null
          echo "nomad reachable at $NOMAD_ADDR"

      - name: Build images
        run: make build

      - name: Restart the infralift job
        run: |
          if [ -f "$HOME/.agentsecrets" ]; then . "$HOME/.agentsecrets"; fi
          export NOMAD_ADDR="${NOMAD_ADDR:-http://127.0.0.1:4646}" NOMAD_TOKEN
          nomad job restart -yes -on-error=fail infralift
