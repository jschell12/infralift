name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The api's types come from the generated Prisma client, and three apps
      # import @infralift/shared — both have to exist before tsc runs.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared packages
        run: pnpm --filter './packages/*' build

      - name: Typecheck
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build apps
        run: pnpm --filter './apps/*' build

  deploy:
    name: Deploy to Framework
    needs: check
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    # Runner is on the Mac Mini (always-on, LAN access to Framework).
    # It rsyncs the checkout to Framework, builds Docker images there,
    # and restarts Nomad allocations.
    runs-on: [self-hosted, infralift-framework]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy via Framework
        run: $HOME/actions-runner/deploy-infralift.sh "$GITHUB_WORKSPACE"
