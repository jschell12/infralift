name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The api's types come from the generated Prisma client, and three apps
      # import @infralift/shared — both have to exist before tsc runs.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared packages
        run: pnpm --filter './packages/*' build

      - name: Typecheck
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build apps
        run: pnpm --filter './apps/*' build

  deploy:
    name: Deploy to Framework
    needs: check
    # Inert until a self-hosted runner is registered and the DEPLOY_ENABLED
    # repository variable is set to "true" — without the guard every merge
    # would queue a job that no runner can pick up.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    # The Nomad cluster lives on the LAN (10.0.0.2) and is not reachable from
    # GitHub-hosted runners, so this runs on a self-hosted runner on the
    # Framework host itself. Images are then built where they are consumed,
    # which makes `make deploy-images` (docker save | ssh docker load)
    # unnecessary.
    runs-on: [self-hosted, infralift-framework]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Build api, dashboard, and admin images
        run: make build

      - name: Roll Nomad allocations onto the new images
        env:
          NOMAD_JOB: ${{ vars.NOMAD_JOB || 'infralift' }}
        run: nomad job restart -reschedule -yes "$NOMAD_JOB"
