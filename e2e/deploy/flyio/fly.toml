# Fly.io configuration for infralift-demo
# Used by `fly deploy` as an alternative to Terraform provisioning.

app = "infralift-e2e"
primary_region = "iad"

[build]
  dockerfile = "../../reference-app/Dockerfile"

[env]
  PROVIDER_NAME = "flyio"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "infralift_e2e_data"
  destination = "/data"
