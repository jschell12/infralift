version: "3.9"

services:
  app:
    image: infralift-demo:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      PROVIDER_NAME: "hetzner"
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: "${DOMAIN}"
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
