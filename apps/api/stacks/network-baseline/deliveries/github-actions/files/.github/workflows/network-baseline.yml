name: network-baseline

# The infralift network-baseline stack in infra/network-baseline. Every
# change must pass `tofu fmt` and validate under OpenTofu (the R2 backend) and
# under Terraform (what a Terraform Cloud workspace runs). Then:
#
#   pull request   a read-only plan (-lock=false), rendered into the job
#                  summary. Never applies. Pull requests from forks get no
#                  secrets, so they get a notice instead of a plan.
#   push to main   a plan saved to a file, then `apply` of exactly that file
#                  in the `production` environment. Add required reviewers
#                  to the environment and the apply waits for one of them,
#                  with the plan they are approving one click away.
#   daily (06:47 UTC) the `infra drift` job: a read-only plan of main against
#                  what is running. Never saved, uploaded or applied. It fails
#                  when the plan would change anything, which means someone
#                  changed infrastructure outside Terraform (or a merged change
#                  is still waiting for its apply). infralift reads the result
#                  and shows it on the project.
#
# Credentials are listed in infra/network-baseline/README.md. Plans read
# repository secrets; the apply job also sees the `production` environment's
# secrets, which win over repository secrets of the same name. So a read-only
# AWS key can go on the repository and a write key on the environment, where
# only main can use it once the environment is limited to that branch.
on:
  pull_request:
    paths: ["infra/network-baseline/**", ".github/workflows/network-baseline.yml"]
  push:
    branches: [main]
    paths: ["infra/network-baseline/**", ".github/workflows/network-baseline.yml"]
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# bash runs every step with -o pipefail, so `tofu apply | tee` fails when the
# apply does. Every step runs in the stack's directory.
defaults:
  run:
    shell: bash
    working-directory: infra/network-baseline

# Pushes to main share one group and never cancel each other: a plan and its
# apply finish before the next push plans. A newer push to a pull request
# replaces its older plan. Drift has its own group so it never cancels a push.
concurrency:
  group: ${{ github.event_name == 'push' && 'network-baseline-main' || (github.event_name == 'pull_request' && format('network-baseline-pr-{0}', github.event.pull_request.number) || 'network-baseline-drift') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: tofu fmt -check -recursive
      - name: tofu validate
        run: tofu init -backend=false -input=false && tofu validate
      - name: terraform validate (as Terraform Cloud runs it)
        run: |
          # The R2 backend uses OpenTofu's state encryption, which terraform
          # does not parse; only the Terraform Cloud variant must pass here.
          if grep -Eq '^[[:space:]]*cloud[[:space:]]*\{' backend.tf; then
            terraform init -backend=false -input=false && terraform validate
          else
            echo "R2 backend: OpenTofu only, terraform validate skipped"
          fi

  plan-fork:
    name: infra plan (fork)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Nothing is checked out, so the stack's directory does not exist here.
    defaults:
      run:
        working-directory: .
    steps:
      - run: |
          msg="Pull requests from forks get no secrets, so there is no plan. A maintainer can push this branch to the repository to get one."
          echo "::notice title=infra plan skipped::$msg"
          { echo "### infra plan skipped"; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: infra plan
    needs: validate
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.backend.outputs.kind }}
      changes: ${{ steps.summary.outputs.changes }}
    env:
      # Only a push to main saves a plan. A pull request's plan is never
      # written anywhere it could be applied from.
      SAVE_PLAN: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: State backend
        id: backend
        run: |
          if grep -Eq '^[[:space:]]*cloud[[:space:]]*\{' backend.tf; then
            echo "kind=tfc" >> "$GITHUB_OUTPUT"
          else
            echo "kind=r2" >> "$GITHUB_OUTPUT"
          fi

      - name: Credentials
        id: creds
        env:
          BACKEND: ${{ steps.backend.outputs.kind }}
          # Presence only; no value enters this step.
          HAS_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          HAS_TFSTATE_R2_ACCESS_KEY_ID: ${{ secrets.TFSTATE_R2_ACCESS_KEY_ID != '' }}
          HAS_TFSTATE_R2_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_R2_SECRET_ACCESS_KEY != '' }}
          HAS_TF_STATE_PASSPHRASE: ${{ secrets.TF_STATE_PASSPHRASE != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_TF_API_TOKEN: ${{ secrets.TF_API_TOKEN != '' }}
        run: |
          if [ "$BACKEND" = tfc ]; then
            need="TF_API_TOKEN"
          else
            need="AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TFSTATE_R2_ACCESS_KEY_ID TFSTATE_R2_SECRET_ACCESS_KEY TF_STATE_PASSPHRASE CLOUDFLARE_ACCOUNT_ID"
          fi
          missing=""
          for n in $need; do
            has="HAS_$n"
            [ "${!has}" = true ] || missing="$missing $n"
          done
          if [ -z "$missing" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          msg="Not set for the $BACKEND backend:$missing. See infra/network-baseline/README.md."
          echo "::warning title=infra plan skipped::$msg"
          { echo "### infra plan skipped"; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"

      - if: steps.creds.outputs.ok == 'true' && steps.backend.outputs.kind == 'r2'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - if: steps.creds.outputs.ok == 'true' && steps.backend.outputs.kind == 'tfc'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: tofu plan (R2 state)
        id: plan_r2
        if: steps.creds.outputs.ok == 'true' && steps.backend.outputs.kind == 'r2'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_state_access_key_id: ${{ secrets.TFSTATE_R2_ACCESS_KEY_ID }}
          TF_VAR_state_secret_access_key: ${{ secrets.TFSTATE_R2_SECRET_ACCESS_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_IN_AUTOMATION: "1"
        run: |
          # backend.r2.hcl is per-account and git-ignored; the committed
          # example names the bucket and key, the account id comes from vars.
          if [ ! -f backend.r2.hcl ]; then
            [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::vars.CLOUDFLARE_ACCOUNT_ID is not a Cloudflare account id"; exit 1; }
            sed "s/<cloudflare-account-id>/$CLOUDFLARE_ACCOUNT_ID/" backend.r2.hcl.example > backend.r2.hcl
          fi
          tofu init -input=false -backend-config=backend.r2.hcl
          args=(-input=false -no-color -lock=false -detailed-exitcode)
          if [ "$SAVE_PLAN" = true ]; then args+=(-out=tfplan); fi
          set +e
          tofu plan "${args[@]}" 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      - name: terraform plan (Terraform Cloud)
        id: plan_tfc
        if: steps.creds.outputs.ok == 'true' && steps.backend.outputs.kind == 'tfc'
        env:
          # The run executes in the workspace, with the workspace's variables.
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_IN_AUTOMATION: "1"
        run: |
          terraform init -input=false
          args=(-input=false -no-color -detailed-exitcode)
          # Without -out this is a speculative run, which TFC cannot apply.
          if [ "$SAVE_PLAN" = true ]; then args+=(-out=tfplan); fi
          set +e
          terraform plan "${args[@]}" 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      - name: Summary
        id: summary
        if: steps.creds.outputs.ok == 'true'
        env:
          CODE: ${{ steps.plan_r2.outputs.exitcode || steps.plan_tfc.outputs.exitcode }}
          TOOL: ${{ steps.backend.outputs.kind == 'tfc' && 'terraform' || 'tofu' }}
        run: |
          # -detailed-exitcode: 0 no changes, 1 error, 2 changes.
          read -r add change destroy < <(
            sed -nE 's/^Plan: (.*, )?([0-9]+) to add, ([0-9]+) to change, ([0-9]+) to destroy.*/\2 \3 \4/p' plan.txt | tail -1
          ) || true
          add=${add:-0} change=${change:-0} destroy=${destroy:-0}
          changes=false
          if [ "$CODE" = 2 ] || [ $((add + change + destroy)) -gt 0 ]; then changes=true; fi
          echo "changes=$changes" >> "$GITHUB_OUTPUT"

          if [ "$CODE" = 1 ] || [ -z "$CODE" ]; then
            title="infra plan failed"
            echo "::error title=$title::$TOOL plan exited ${CODE:-without a code}; see the log"
          elif [ "$changes" = false ]; then
            title="infra plan: no changes"
            echo "::notice title=infra plan::no changes"
          else
            title="infra plan: $add to add, $change to change, $destroy to destroy"
            level=notice
            if [ "$destroy" -gt 0 ]; then level=warning; fi
            echo "::$level title=infra plan::$add to add, $change to change, $destroy to destroy"
          fi

          limit=60000
          {
            echo "### $title"
            echo
            echo "<details><summary>$TOOL plan output</summary>"
            echo
            echo '````text'
            head -c "$limit" plan.txt
            echo
            echo '````'
            if [ "$(wc -c < plan.txt)" -gt "$limit" ]; then
              echo
              echo "Truncated at $limit bytes; the whole plan is in this job's log."
            fi
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CODE" = 1 ] || [ -z "$CODE" ]; then exit 1; fi

      # The saved plan is what the apply job runs, with the provider lock it
      # was made with. For R2 it is encrypted with the state passphrase; for
      # Terraform Cloud it only names the run.
      - name: Keep the plan for apply
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'push' && steps.summary.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: infra-plan
          path: |
            infra/network-baseline/tfplan
            infra/network-baseline/.terraform.lock.hcl
            infra/network-baseline/plan.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5

  apply:
    name: infra apply
    needs: plan
    # Never on a pull request, and only when the plan changes something.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: infra-plan
          path: infra/network-baseline

      - if: needs.plan.outputs.backend == 'r2'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - if: needs.plan.outputs.backend == 'tfc'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: tofu apply (R2 state)
        if: needs.plan.outputs.backend == 'r2'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_state_access_key_id: ${{ secrets.TFSTATE_R2_ACCESS_KEY_ID }}
          TF_VAR_state_secret_access_key: ${{ secrets.TFSTATE_R2_SECRET_ACCESS_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_IN_AUTOMATION: "1"
        run: |
          if [ ! -f backend.r2.hcl ]; then
            [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::vars.CLOUDFLARE_ACCOUNT_ID is not a Cloudflare account id"; exit 1; }
            sed "s/<cloudflare-account-id>/$CLOUDFLARE_ACCOUNT_ID/" backend.r2.hcl.example > backend.r2.hcl
          fi
          tofu init -input=false -backend-config=backend.r2.hcl
          # A saved plan applies as planned or not at all: tofu refuses it if
          # state moved since, and this run takes the state lock.
          tofu apply -input=false -no-color tfplan 2>&1 | tee apply.txt

      - name: terraform apply (Terraform Cloud)
        if: needs.plan.outputs.backend == 'tfc'
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_IN_AUTOMATION: "1"
        run: |
          terraform init -input=false
          # Confirms the saved run the plan job made, nothing newer.
          terraform apply -input=false -no-color tfplan 2>&1 | tee apply.txt

      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### infra apply: $STATUS"
            echo
            echo '````text'
            if [ -f apply.txt ]; then tail -c 30000 apply.txt; else echo "apply did not start"; fi
            echo
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

  drift:
    name: infra drift
    # Plans only. No -out, no artifact, no apply job depends on it. Exit code
    # 2 from -detailed-exitcode is drift.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: State backend
        id: backend
        run: |
          if grep -Eq '^[[:space:]]*cloud[[:space:]]*\{' backend.tf; then
            echo "kind=tfc" >> "$GITHUB_OUTPUT"
          else
            echo "kind=r2" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.backend.outputs.kind == 'r2'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - if: steps.backend.outputs.kind == 'tfc'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: tofu plan (R2 state)
        id: plan_r2
        if: steps.backend.outputs.kind == 'r2'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_state_access_key_id: ${{ secrets.TFSTATE_R2_ACCESS_KEY_ID }}
          TF_VAR_state_secret_access_key: ${{ secrets.TFSTATE_R2_SECRET_ACCESS_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_IN_AUTOMATION: "1"
        run: |
          if [ ! -f backend.r2.hcl ]; then
            [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::vars.CLOUDFLARE_ACCOUNT_ID is not a Cloudflare account id"; exit 1; }
            sed "s/<cloudflare-account-id>/$CLOUDFLARE_ACCOUNT_ID/" backend.r2.hcl.example > backend.r2.hcl
          fi
          tofu init -input=false -backend-config=backend.r2.hcl
          set +e
          tofu plan -input=false -no-color -lock=false -detailed-exitcode 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      - name: terraform plan (Terraform Cloud)
        id: plan_tfc
        if: steps.backend.outputs.kind == 'tfc'
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_IN_AUTOMATION: "1"
        run: |
          terraform init -input=false
          # A speculative run: without -out, TFC cannot apply it.
          set +e
          terraform plan -input=false -no-color -detailed-exitcode 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      - name: Result
        if: always()
        env:
          CODE: ${{ steps.plan_r2.outputs.exitcode || steps.plan_tfc.outputs.exitcode }}
        run: |
          # These lines are what infralift reads back; keep the wording.
          touch plan.txt
          read -r add change destroy < <(
            sed -nE 's/^Plan: (.*, )?([0-9]+) to add, ([0-9]+) to change, ([0-9]+) to destroy.*/\2 \3 \4/p' plan.txt | tail -1
          ) || true
          add=${add:-0} change=${change:-0} destroy=${destroy:-0}
          if [ "$CODE" = 0 ]; then
            title="No drift: the plan changes nothing."
            echo "::notice title=infra drift::$title"
          elif [ "$CODE" = 2 ]; then
            title="Drift: $add to add, $change to change, $destroy to destroy. Something changed outside Terraform, or a merged change is not applied yet."
            echo "::error title=infra drift::$title"
          else
            title="The drift plan failed, so drift is unknown. Check the secrets listed in infra/network-baseline/README.md."
            echo "::error title=infra drift::$title"
          fi
          {
            echo "### infra drift"
            echo
            echo "$title"
            echo
            echo '````text'
            head -c 60000 plan.txt
            echo
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$CODE" = 0 ]
