# GENERATED by infralift (stack app-foundry-hetzner, GitLab CI delivery).
#
# The same delivery as the GitHub Actions one, job for job:
#   build           four images per commit to this project's registry, no
#                   environment baked in, so production and every review app
#                   run the same images
#   deploy_prod     default branch: ship deploy/box, deploy.sh prod, smoke test
#   preview         a review app per same-project merge request, on a preview
#                   slot the box assigns; stop_preview tears it down when the
#                   merge request is merged or closed
#   backup          nightly (the BACKUP=1 schedule tofu creates): pg_dump to R2
#   verify_restore  restore that dump into a throwaway Postgres and check it
#   infra_validate  tofu fmt/validate and shellcheck on changes under deploy/
#   infra_plan      a read-only plan of deploy/infra on same-project merge
#                   requests (never applied), and a saved plan on the default
#                   branch
#   infra_apply     default branch only: applies that saved plan, in the
#                   production environment, by hand unless INFRA_AUTO_APPLY=1
#
# Every deploy job is skipped until tofu has written SSH_HOST, so nothing
# runs against infrastructure that does not exist yet. A pipeline run with
# BACKUP=1 (the schedule, or by hand) runs only the backup jobs.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# infra is after deploy so a waiting manual apply holds up nothing; its jobs
# use needs: and start as soon as validation passes.
stages: [validate, build, deploy, infra, backup, verify]

variables:
  IMAGE_TAG: $CI_COMMIT_SHA
  # Pinned with its published SHA-256; bump both together.
  CLOUDFLARED_VERSION: "2026.10.7"
  CLOUDFLARED_SHA256: "70b1a1e0f46033ffc8d90b406e554044ba6cbf2e4360295ef1163aed31e09393"

# -- shared ---------------------------------------------------------------------

# `ssh box` reaches the server through the Cloudflare tunnel, authenticated to
# Access with the deploy service token. The host key is pinned from
# SSH_KNOWN_HOSTS, which tofu wrote.
.box_ssh:
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl openssh-client rsync >/dev/null
    - curl -fsSL -o /tmp/cloudflared.deb "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
    - echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared.deb" | sha256sum -c -
    - dpkg -i /tmp/cloudflared.deb >/dev/null
    - install -d -m 700 ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/box && chmod 600 ~/.ssh/box
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - |
      cat > ~/.ssh/config <<CFG
      Host box
        HostName $SSH_HOST
        User deploy
        IdentityFile ~/.ssh/box
        StrictHostKeyChecking yes
        ProxyCommand cloudflared access ssh --hostname %h --id $CF_ACCESS_CLIENT_ID --secret $CF_ACCESS_CLIENT_SECRET
      CFG
    - chmod 600 ~/.ssh/config
    - ssh box true

.smoke: &smoke |
  for _ in $(seq 20); do
    if curl -fsS "https://$SMOKE_HOST/api/health" | grep -q '"database":"ok"'; then exit 0; fi
    sleep 6
  done
  echo "https://$SMOKE_HOST/api/health never reported a healthy database" >&2
  exit 1

# -- build ----------------------------------------------------------------------

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $SSH_HOST == null || $SSH_HOST == ""
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" || $BACKUP == "1"
      when: never
    # Merge requests from forks get no variables and are not built.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  parallel:
    matrix:
      - { NAME: api, DOCKERFILE: infra/docker/api.Dockerfile, APP: "", BASE: "/" }
      - { NAME: marketing, DOCKERFILE: infra/docker/web.Dockerfile, APP: marketing, BASE: "/" }
      - { NAME: dashboard, DOCKERFILE: infra/docker/web.Dockerfile, APP: dashboard, BASE: "/app/" }
      - { NAME: admin, DOCKERFILE: infra/docker/web.Dockerfile, APP: admin, BASE: "/admin/" }
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - >
      docker build -f "$DOCKERFILE"
      --build-arg APP="$APP" --build-arg VITE_API_URL=/api --build-arg VITE_BASE="$BASE"
      -t "$CI_REGISTRY_IMAGE/app-foundry-$NAME:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE/app-foundry-$NAME:$IMAGE_TAG"

# -- production -----------------------------------------------------------------

deploy_prod:
  extends: .box_ssh
  stage: deploy
  needs: [build]
  rules:
    - if: $SSH_HOST == null || $SSH_HOST == ""
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" || $BACKUP == "1"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: production
  environment:
    name: production
    url: https://$PROD_HOST
  variables:
    SMOKE_HOST: $PROD_HOST
  script:
    - ssh box "mkdir -p /srv/app-foundry/code/prod"
    - rsync -a --delete deploy/box/ box:/srv/app-foundry/code/prod/
    - echo "$CI_REGISTRY_PASSWORD" | ssh box "docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin" >/dev/null
    - ssh box "/srv/app-foundry/code/prod/bin/deploy.sh prod $PROD_HOST $IMAGE_TAG $CI_REGISTRY_IMAGE"
    - *smoke

# -- review apps ----------------------------------------------------------------

.preview_rules: &preview_rules
  - if: $SSH_HOST == null || $SSH_HOST == ""
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID

preview:
  extends: .box_ssh
  stage: deploy
  needs: [build]
  rules: *preview_rules
  resource_group: review-$CI_MERGE_REQUEST_IID
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    url: https://$PREVIEW_URL_HOST
    on_stop: stop_preview
    auto_stop_in: 2 weeks
  variables:
    PR_ENV: pr-$CI_MERGE_REQUEST_IID
  script:
    - ssh box "mkdir -p /srv/app-foundry/code/$PR_ENV"
    - rsync -a --delete deploy/box/ "box:/srv/app-foundry/code/$PR_ENV/"
    - echo "$CI_REGISTRY_PASSWORD" | ssh box "docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin" >/dev/null
    - set -o pipefail
    - ssh box "MAX_PREVIEWS=$MAX_PREVIEWS /srv/app-foundry/code/$PR_ENV/bin/deploy.sh $PR_ENV '$PREVIEW_HOST' $IMAGE_TAG $CI_REGISTRY_IMAGE" | tee deploy.out
    - SMOKE_HOST=$(sed -n 's/^HOST=//p' deploy.out | tail -1)
    - test -n "$SMOKE_HOST" || { echo "deploy.sh did not report a host" >&2; exit 1; }
    - echo "PREVIEW_URL_HOST=$SMOKE_HOST" > deploy.env
    - *smoke
  artifacts:
    reports:
      dotenv: deploy.env

# GitLab runs this when the merge request is merged or closed. It uses the
# default branch's teardown.sh, so closing a merge request never runs code it
# changed.
stop_preview:
  extends: .box_ssh
  stage: deploy
  rules:
    - if: $SSH_HOST == null || $SSH_HOST == ""
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
      when: manual
  allow_failure: true
  resource_group: review-$CI_MERGE_REQUEST_IID
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    action: stop
  variables:
    GIT_STRATEGY: none
    PR_ENV: pr-$CI_MERGE_REQUEST_IID
  script:
    - ssh box "/srv/app-foundry/code/prod/bin/teardown.sh $PR_ENV"

# -- backups --------------------------------------------------------------------

.backup_rules: &backup_rules
  - if: $SSH_HOST == null || $SSH_HOST == ""
    when: never
  - if: $BACKUP == "1" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# R2 credentials are exported in the job's own shell rather than set as job
# variables: job variables are also handed to service containers.
.r2_env: &r2_env |
  export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
  export AWS_DEFAULT_REGION=auto AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required

backup:
  extends: .box_ssh
  image: python:3.12-slim
  stage: backup
  rules: *backup_rules
  script:
    - *r2_env
    - pip install -q awscli
    - KEY="prod/$(date -u +%Y-%m-%dT%H%MZ).dump"
    - ssh box /srv/app-foundry/code/prod/bin/backup.sh prod > db.dump
    - test -s db.dump
    - aws s3 cp db.dump "s3://$R2_BUCKET/$KEY" --endpoint-url "$R2_ENDPOINT" --no-progress
    - echo "BACKUP_KEY=$KEY" > backup.env
    - echo "wrote $KEY ($(stat -c %s db.dump) bytes)"
  artifacts:
    reports:
      dotenv: backup.env

# A backup that has never been restored is a guess, so every night's dump is
# read back from R2 into a scratch Postgres of the same major version.
verify_restore:
  stage: verify
  # Same major version as the server, so pg_restore reads its dump format.
  image:
    name: postgres:17
    entrypoint: [""]
  needs: [backup]
  rules: *backup_rules
  services:
    - name: postgres:17
      alias: scratchdb
  variables:
    POSTGRES_PASSWORD: scratch
    POSTGRES_DB: app
    PGPASSWORD: scratch
  script:
    - *r2_env
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends awscli >/dev/null
    - aws s3 cp "s3://$R2_BUCKET/$BACKUP_KEY" db.dump --endpoint-url "$R2_ENDPOINT" --no-progress
    - for _ in $(seq 30); do pg_isready -h scratchdb -U postgres && break; sleep 2; done
    - pg_restore -h scratchdb -U postgres -d app --no-owner --exit-on-error db.dump
    - test "$(psql -h scratchdb -U postgres -d app -tAc "select to_regclass('public.analytics_events') is not null")" = t
    - echo "restored $BACKUP_KEY with $(psql -h scratchdb -U postgres -d app -tAc 'select count(*) from analytics_events') analytics_events rows"

# -- infrastructure checks ------------------------------------------------------

.infra_rules: &infra_rules
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - changes: [deploy/**/*, .gitlab-ci.yml]

infra_validate:
  stage: validate
  image: debian:bookworm-slim
  rules: *infra_rules
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git gnupg >/dev/null
    # The deb method installs from OpenTofu's signed apt repository.
    - curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh
    - sh /tmp/install-opentofu.sh --install-method deb >/dev/null
    - tofu fmt -check -recursive deploy
    - (cd deploy/infra && tofu init -backend=false -input=false && tofu validate)
    - if [ -d deploy/bootstrap ]; then (cd deploy/bootstrap && tofu init -backend=false -input=false && tofu validate); fi

terraform_validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  rules: *infra_rules
  script:
    # What a Terraform Cloud workspace runs: generated/ must stay valid under terraform.
    - cd deploy/infra/generated && terraform init -backend=false -input=false && terraform validate

shellcheck:
  stage: validate
  image: koalaman/shellcheck-alpine:stable
  rules: *infra_rules
  script:
    - shellcheck deploy/box/bin/*.sh deploy/box/test-local.sh

# -- infrastructure: plan on merge requests, apply on the default branch --------
#
# Credentials are CI/CD variables (deploy/README.md lists them). Give read-only
# values the environment scope "*" and write values the scope "production",
# protected: only infra_apply names that environment, so only it gets them,
# and only on a protected branch.

.infra_tool:
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git gnupg >/dev/null
    # backend.tf says which state backend this project uses. Both tools come
    # from their vendor's signed apt repository.
    - |
      if grep -Eq '^[[:space:]]*cloud[[:space:]]*\{' deploy/infra/backend.tf; then
        export INFRA_BACKEND=tfc TF=terraform
        curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com bookworm main" > /etc/apt/sources.list.d/hashicorp.list
        apt-get update -qq && apt-get install -y -qq --no-install-recommends terraform >/dev/null
      else
        export INFRA_BACKEND=r2 TF=tofu
        curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh
        sh /tmp/install-opentofu.sh --install-method deb >/dev/null
      fi
    # Credentials go into this job's shell only, under the names the
    # providers and the backend read.
    - |
      export TF_IN_AUTOMATION=1
      if [ "$INFRA_BACKEND" = tfc ]; then
        # The run executes in the workspace, with the workspace's variables.
        export TF_TOKEN_app_terraform_io="$TF_API_TOKEN"
        INFRA_NEEDS="TF_API_TOKEN"
      else
        export AWS_ACCESS_KEY_ID="$TFSTATE_R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$TFSTATE_R2_SECRET_ACCESS_KEY"
        export TF_VAR_state_passphrase="$TF_STATE_PASSPHRASE" GITLAB_TOKEN="$INFRA_GIT_TOKEN"
        export TF_VAR_r2_backup_access_key_id="$BACKUP_R2_ACCESS_KEY_ID" TF_VAR_r2_backup_secret_access_key="$BACKUP_R2_SECRET_ACCESS_KEY"
        export TF_VAR_cloudflare_account_id="$CLOUDFLARE_ACCOUNT_ID" TF_VAR_admin_emails="$ADMIN_EMAILS"
        INFRA_NEEDS="HCLOUD_TOKEN CLOUDFLARE_API_TOKEN INFRA_GIT_TOKEN BACKUP_R2_ACCESS_KEY_ID BACKUP_R2_SECRET_ACCESS_KEY TFSTATE_R2_ACCESS_KEY_ID TFSTATE_R2_SECRET_ACCESS_KEY TF_STATE_PASSPHRASE CLOUDFLARE_ACCOUNT_ID ADMIN_EMAILS"
      fi
      INFRA_MISSING=""
      for n in $INFRA_NEEDS; do
        eval "v=\${$n:-}"
        [ -n "$v" ] || INFRA_MISSING="$INFRA_MISSING $n"
      done
      unset v
    # backend.r2.hcl is per-account and git-ignored; the committed example
    # names the bucket and key, CLOUDFLARE_ACCOUNT_ID completes it.
    - |
      cd deploy/infra
      if [ "$INFRA_BACKEND" = r2 ] && [ -z "$INFRA_MISSING" ] && [ ! -f backend.r2.hcl ]; then
        echo "$CLOUDFLARE_ACCOUNT_ID" | grep -Eqx '[0-9a-f]{32}' || { echo "CLOUDFLARE_ACCOUNT_ID is not a Cloudflare account id" >&2; exit 1; }
        sed "s/<cloudflare-account-id>/$CLOUDFLARE_ACCOUNT_ID/" backend.r2.hcl.example > backend.r2.hcl
      fi

infra_plan:
  extends: .infra_tool
  stage: infra
  needs: [infra_validate, terraform_validate]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $BACKUP == "1"
      when: never
    # Merge requests from forks get no variables, so no plan.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
      changes: [deploy/**/*, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [deploy/**/*, .gitlab-ci.yml]
  # before_script left the shell in deploy/infra.
  script:
    - echo "INFRA_CHANGES=false" > infra.env
    - |
      if [ -n "$INFRA_MISSING" ]; then
        echo "infra plan skipped: not set for the $INFRA_BACKEND backend:$INFRA_MISSING. See deploy/README.md."
        exit 0
      fi
    - if [ "$INFRA_BACKEND" = r2 ]; then $TF init -input=false -backend-config=backend.r2.hcl; else $TF init -input=false; fi
    # Only the default branch saves a plan. A merge request's plan is never
    # written anywhere it could be applied from (for TFC it is a speculative
    # run), and -lock=false keeps it from taking the state lock.
    - |
      set -- -input=false -no-color -detailed-exitcode
      if [ "$INFRA_BACKEND" = r2 ]; then set -- "$@" -lock=false; fi
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then set -- "$@" -out=tfplan; fi
      set +e
      $TF plan "$@" > plan.txt 2>&1
      code=$?
      set -e
      cat plan.txt
      counts=$(sed -nE 's/^Plan: (.*, )?([0-9]+) to add, ([0-9]+) to change, ([0-9]+) to destroy.*/\2 \3 \4/p' plan.txt | tail -1)
      set -- ${counts:-0 0 0}
      add=$1 change=$2 destroy=$3
      # Read by the merge request's Terraform widget.
      printf '{"create": %s, "update": %s, "delete": %s}\n' "$add" "$change" "$destroy" > plan.json
      if [ "$code" = 1 ]; then echo "infra plan failed" >&2; exit 1; fi
      if [ "$code" = 2 ] || [ $((add + change + destroy)) -gt 0 ]; then
        echo "INFRA_CHANGES=true" > infra.env
        echo "infra plan: $add to add, $change to change, $destroy to destroy"
      else
        echo "infra plan: no changes"
      fi
  # The saved plan is what infra_apply runs, with the provider lock it was
  # made with. For R2 it is encrypted with the state passphrase; for TFC it
  # only names the run.
  artifacts:
    when: always
    access: developer
    expire_in: 5 days
    paths:
      - deploy/infra/tfplan
      - deploy/infra/.terraform.lock.hcl
      - deploy/infra/plan.txt
    reports:
      dotenv: deploy/infra/infra.env
      terraform: deploy/infra/plan.json

infra_apply:
  extends: .infra_tool
  stage: infra
  needs: [infra_plan]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $BACKUP == "1"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $INFRA_AUTO_APPLY == "1"
      changes: [deploy/**/*, .gitlab-ci.yml]
    # Blocking: the pipeline shows as waiting until someone applies, and a
    # failed apply fails it.
    - changes: [deploy/**/*, .gitlab-ci.yml]
      when: manual
      allow_failure: false
  # Shared with deploy_prod: one change to production at a time.
  resource_group: production
  environment:
    name: production
  script:
    - |
      if [ "$INFRA_CHANGES" != true ]; then
        echo "the plan changes nothing; nothing to apply"
        exit 0
      fi
    - if [ -n "$INFRA_MISSING" ]; then echo "not set for the $INFRA_BACKEND backend:$INFRA_MISSING" >&2; exit 1; fi
    - if [ "$INFRA_BACKEND" = r2 ]; then $TF init -input=false -backend-config=backend.r2.hcl; else $TF init -input=false; fi
    # A saved plan applies as planned or not at all: it is refused if state
    # moved since, and the apply takes the state lock.
    - $TF apply -input=false -no-color tfplan
